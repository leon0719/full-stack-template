# Django Ninja API — 主機 nginx 反向代理站台設定（取代內建 Caddy 時使用）
#
# 什麼時候用這份、什麼時候用 Caddy：見 docs/nginx.md。
#
# 安裝（主機上，需要 sudo；不納入 CD 自動套用）：
#   sudo cp docker/nginx/api.conf /etc/nginx/sites-available/api
#   sudo ln -sf /etc/nginx/sites-available/api /etc/nginx/sites-enabled/api
#   sudo nginx -t && sudo systemctl reload nginx
#
# 要改的地方都標了 CHANGEME：server_name、憑證路徑、/admin/ allowlist。
# 拓撲：訪客 ──HTTPS──▶ nginx (443) ──HTTP──▶ 127.0.0.1:8000（compose 的 api，只綁 loopback）
#
# 變數 / map / upstream 名稱都加 api_ 前綴：sites-enabled 底下所有站台共用同一個 http context，
# 不加前綴會和同主機其他站台的 map 撞名。

upstream api_backend {
    server 127.0.0.1:8000;
    # 重用到 uvicorn 的連線。uvicorn 的 keep-alive（UVICORN_TIMEOUT_KEEP_ALIVE=130s）必須比
    # nginx 這端的閒置時間（keepalive_timeout，預設 60s）長，否則偶發 502。
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.example.com;  # CHANGEME

    # ACME http-01（certbot --webroot）要能走 80；其餘一律轉 HTTPS。
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # nginx >= 1.25.1 可改寫成 `listen 443 ssl;` + `http2 on;`；這個寫法 1.24（Ubuntu 24.04）也能用。
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.example.com;  # CHANGEME

    # CHANGEME：Let's Encrypt（certbot）或 Cloudflare Origin CA 憑證。
    ssl_certificate     /etc/letsencrypt/live/api.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:api_ssl:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    server_tokens off;

    # 安全 header。Django（config/settings/prod.py）也會送 HSTS / nosniff / Referrer-Policy / CSP，
    # 這裡再加一次是為了涵蓋 nginx 自己產生的回應（413、502、301 等不會經過 Django）。
    # always：連錯誤回應也帶。HSTS 一旦送出，瀏覽器一年內只走 HTTPS——確定 HTTPS 正常才啟用。
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Django 送的同名 header 拿掉，避免回應裡同一個 header 出現兩次（值以這裡為準）。
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;

    # 本專案沒有檔案上傳端點，請求只有 JSON：略大於 Django 的 DATA_UPLOAD_MAX_MEMORY_SIZE（預設 2.5MB）
    # 即可。之後加上傳功能時跟著調高。
    client_max_body_size 4m;

    access_log /var/log/nginx/api.access.log;
    error_log  /var/log/nginx/api.error.log;

    # 前面還有 Cloudflare 橘雲時：取消註解，只信任 Cloudflare 範圍送來的 CF-Connecting-IP，
    # $remote_addr 才是真實 client IP（/admin allowlist 靠它）。清單來源 https://www.cloudflare.com/ips/
    # （與 docker/Caddyfile 的 trusted_proxies 同一份）。此時 .env.prod 的 NINJA_NUM_PROXIES=2。
    # real_ip_header CF-Connecting-IP;
    # set_real_ip_from 173.245.48.0/20;
    # set_real_ip_from 103.21.244.0/22;
    # set_real_ip_from 103.22.200.0/22;
    # set_real_ip_from 103.31.4.0/22;
    # set_real_ip_from 141.101.64.0/18;
    # set_real_ip_from 108.162.192.0/18;
    # set_real_ip_from 190.93.240.0/20;
    # set_real_ip_from 188.114.96.0/20;
    # set_real_ip_from 197.234.240.0/22;
    # set_real_ip_from 198.41.128.0/17;
    # set_real_ip_from 162.158.0.0/15;
    # set_real_ip_from 104.16.0.0/13;
    # set_real_ip_from 104.24.0.0/14;
    # set_real_ip_from 172.64.0.0/13;
    # set_real_ip_from 131.0.72.0/22;
    # set_real_ip_from 2400:cb00::/32;
    # set_real_ip_from 2606:4700::/32;
    # set_real_ip_from 2803:f800::/32;
    # set_real_ip_from 2405:b500::/32;
    # set_real_ip_from 2405:8100::/32;
    # set_real_ip_from 2a06:98c0::/29;
    # set_real_ip_from 2c0f:f248::/32;

    # 所有 location 共用的代理 header。X-Forwarded-For 用 $proxy_add_x_forwarded_for（附加在後面），
    # 對應 NINJA_NUM_PROXIES：nginx 1 層 = 1，前面再加 Cloudflare = 2。
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";
    proxy_connect_timeout 5s;
    proxy_read_timeout    60s;

    # /admin/：Django session 登入，只驗密碼（不是 LINE Login）、沒有 rate limit——上線前必須限制來源。
    # ^~：/admin/... 底下所有子路徑（含 admin 的 static）都套用，不會被下面的 regex location 搶走。
    location ^~ /admin/ {
        allow 203.0.113.10;  # CHANGEME：公司對外固定 IP（可多行）
        deny  all;
        proxy_pass http://api_backend;
    }

    # 本專案沒有 WebSocket / SSE 端點。之後加串流端點時要補對應 location（WebSocket 的 Upgrade
    # header、SSE 的 proxy_buffering off + 長 proxy_read_timeout），見 docs/nginx.md。

    location / {
        proxy_pass http://api_backend;
    }
}
