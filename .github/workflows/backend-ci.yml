name: Backend CI

on:
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/backend-ci.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend-ci.yml"]

permissions:
  contents: read

# Cancel superseded runs for the same ref (new push to a PR) to save runners — but never on
# main: a newer push must not cancel a run whose deploy job is halfway through a migration.
concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

defaults:
  run:
    working-directory: backend

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-insecure-key
      DATABASE_URL: "sqlite://:memory:"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          # Same uv minor as backend/docker/Dockerfile's pinned uv image.
          version: "0.13.x"
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"
          prune-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Format check
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy .

      - name: Migrations are up to date
        run: uv run python manage.py makemigrations --check --dry-run

      # prod 環境變數統一放在 backend/.env.ci（與下方 smoke test 共用）。用 shell source
      # 而非 step env / uv --env-file，是為了讓檔案值蓋過 job-level 的短 SECRET_KEY。
      - name: Deployment checks (check --deploy)
        run: |
          set -a && . ./.env.ci && set +a
          uv run python manage.py check --deploy --fail-level WARNING

      - name: Tests
        run: uv run pytest --cov=apps --cov=config --cov-report=term-missing --cov-fail-under=70

  tests-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18@sha256:4aabea78cf39b90e834caf3af7d602a18565f6fe2508705c8d01aa63245c2e20
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SECRET_KEY: ci-insecure-key
      DATABASE_URL: "postgresql://app:app@localhost:5432/app"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          # Same uv minor as backend/docker/Dockerfile's pinned uv image.
          version: "0.13.x"
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"
          prune-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Tests (Postgres)
        run: uv run pytest

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          # Same uv minor as backend/docker/Dockerfile's pinned uv image.
          version: "0.13.x"
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"
          prune-cache: true

      - name: Export locked requirements
        run: uv export --frozen --no-dev --no-emit-project --format requirements-txt -o requirements-audit.txt

      - name: pip-audit
        run: uvx pip-audit==2.10.1 --disable-pip -r requirements-audit.txt

  # 靜態分析找 OWASP 常見程式碼弱點(SQL/命令注入、硬編碼密碼、不安全反序列化等)。
  # 只掃我們自己寫的 app 程式碼,不含 migrations/tests。
  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.x"
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"
          prune-cache: true

      # -ll = 只擋 medium 以上嚴重度,避免測試檔案裡的 assert(B101)洗版
      # (ruff 對 tests/conftest 也是同樣忽略 S101,見 pyproject.toml)。
      - name: bandit
        run: uvx bandit==1.9.4 -r apps config -ll -x "*/migrations/*,*/tests.py,*/test_*.py,*/conftest.py"

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build prod image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./backend
          file: backend/docker/Dockerfile
          tags: app:ci
          push: false
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy image scan
        # Pinned by commit SHA, not tag: upstream has deleted/retagged release tags
        # before (the old 0.28.0 pin now fails with "unable to find version").
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: app:ci
          format: table
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      - name: Smoke test /health/live
        working-directory: .
        run: |
          # 環境變數與 check --deploy 共用 backend/.env.ci；prod 新增必填變數時只改那份檔。
          docker run -d --name smoke -p 8000:8000 --env-file backend/.env.ci app:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health/live; then
              echo "smoke test passed"
              exit 0
            fi
            sleep 2
          done
          echo "smoke test FAILED — container logs:"
          docker logs smoke
          exit 1

      - name: Dump container logs on failure
        if: failure()
        working-directory: .
        run: docker logs smoke || true

      - name: Cleanup
        if: always()
        working-directory: .
        run: docker rm -f smoke || true

  # 主機 nginx 站台設定範例（backend/docker/nginx/，見 backend/docs/nginx.md）的語法檢查。設定引用
  # 主機上的憑證路徑，CI 沒有這些檔案，先產生自簽憑證頂替。用 stdin 餵入，不依賴 bind mount。
  nginx:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: nginx -t
        run: |
          docker run --rm -i nginx:1.28-alpine@sha256:a8b39bd9cf0f83869a2162827a0caf6137ddf759d50a171451b335cecc87d236 sh -c '
            set -e
            cat > /etc/nginx/conf.d/api.conf
            apk add --no-cache openssl >/dev/null
            mkdir -p /etc/letsencrypt/live/api.example.com
            openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj "/CN=api.example.com" \
              -keyout /etc/letsencrypt/live/api.example.com/privkey.pem \
              -out /etc/letsencrypt/live/api.example.com/fullchain.pem >/dev/null 2>&1
            nginx -t
          ' < docker/nginx/api.conf

  # CD（後端）：CI 全部通過、push 到 main、且 repo variable DEPLOY_ENABLED == 'true' 才跑——模板預設不部署。
  # SSH 進主機 → 快轉到這次 CI 驗過的 commit → 備份 → build → migrate → up → 輪詢 /health/ready。
  # 因為 workflow 有 paths filter，只改前端的 push 不會觸發後端部署（前端走 make deploy-frontend）。
  # 設定（Settings → Secrets and variables → Actions）與主機前置作業見 backend/docs/deployment.md「自動部署（CD）」。
  deploy:
    needs: [quality, tests-postgres, audit, sast, docker, nginx]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    # GitHub Environment：可加 required reviewers / 部署分支限制，secrets 也能只給這個 environment。
    environment: production
    # 一次只跑一個部署；不取消進行中的（半套部署比慢一點更糟）。
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    timeout-minutes: 30
    defaults:
      run:
        # 本 job 不做 checkout，workflow 層級的 working-directory（backend）不存在。
        working-directory: .
    steps:
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          if [ -z "$SSH_KEY" ] || [ -z "$KNOWN_HOSTS" ]; then
            echo "::error::DEPLOY_SSH_KEY / DEPLOY_KNOWN_HOSTS secret 未設定（見 backend/docs/deployment.md「自動部署（CD）」）"
            exit 1
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # 固定 host key（ssh-keyscan 的輸出存成 secret），不用 StrictHostKeyChecking=no：
          # 否則 DNS/路由被劫持時，CI 會把部署指令送給冒牌主機。
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Deploy over SSH
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          PORT: ${{ vars.DEPLOY_PORT || '22' }}
          # 主機上這個 monorepo 的 clone 位置（repo 根目錄，不是 backend/）。
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          HEALTH_RETRIES: ${{ vars.DEPLOY_HEALTH_RETRIES || '30' }}
          SHA: ${{ github.sha }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "$PORT" -o BatchMode=yes -o ConnectTimeout=15 \
            "$DEPLOY_USER@$HOST" bash -s -- "$DEPLOY_PATH" "$SHA" "$HEALTH_RETRIES" <<'REMOTE'
          set -euo pipefail
          DEPLOY_PATH="$1"; SHA="$2"; HEALTH_RETRIES="$3"
          cd "$DEPLOY_PATH"

          echo "==> git: fast-forward to $SHA"
          # 只快轉到「這次 CI 驗過的 commit」：不會順便部署之後才 push、還沒跑完 CI 的版本；
          # 主機上有人手改過檔案或分支分岔時直接失敗，不會 reset 掉別人的修改。
          git fetch --quiet origin main
          git merge --ff-only "$SHA"

          cd backend
          COMPOSE="docker compose --env-file .env.prod -f docker/docker-compose.prod.yml"
          echo "==> backup (before anything changes; a failed backup aborts the deploy)"
          make prod-backup
          echo "==> build"
          make prod-build
          echo "==> migrate (old containers keep serving; migrations must be expand/contract)"
          make prod-migrate
          echo "==> up"
          make prod-up SKIP_BACKUP=1

          echo "==> wait for /health/ready (max ${HEALTH_RETRIES} x 5s)"
          for i in $(seq 1 "$HEALTH_RETRIES"); do
            if curl -fsS -o /dev/null --max-time 5 http://127.0.0.1:8000/health/ready; then
              echo "deploy OK: $(git rev-parse --short HEAD)"
              exit 0
            fi
            sleep 5
          done
          echo "::error::/health/ready did not return 200 after ${HEALTH_RETRIES} attempts"
          $COMPOSE ps
          $COMPOSE logs --no-color --tail 100 api celery-worker celery-beat migrate
          exit 1
          REMOTE

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key

  # CI 紅了但沒人知道,等同於沒有 CI。GitHub 預設只寄 email,通常沉在信箱裡。
  # 只在 main 分支失敗時通知 —— PR 的紅燈作者自己看得到,不需要吵整個 channel。
  notify:
    if: failure() && github.ref == 'refs/heads/main'
    needs: [quality, tests-postgres, audit, sast, docker, nginx, deploy]
    runs-on: ubuntu-latest
    steps:
      - name: Notify Slack
        # 本 job 不做 checkout,workflow 層級的 defaults.run.working-directory
        # 指向的子目錄並不存在 —— 必須覆寫回 repo 根目錄。
        working-directory: .
        env:
          WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "::warning title=CI 失敗通知未啟用::未設定 SLACK_WEBHOOK_URL secret,這次的 CI 失敗沒有通知到 Slack。設定步驟見 backend/docs/alerting.md 第 5 節。"
            exit 0
          fi
          curl -fsS -X POST "$WEBHOOK" \
            -H 'Content-Type: application/json' \
            -d @- <<JSON
          {
            "text": ":rotating_light: Backend CI failed on \`main\` — ${{ github.repository }}",
            "blocks": [
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": ":rotating_light: *Backend CI failed on \`main\`*\n*Repo:* ${{ github.repository }}\n*Commit:* \`${{ github.sha }}\`\n*Author:* ${{ github.actor }}"
                }
              },
              {
                "type": "actions",
                "elements": [
                  {
                    "type": "button",
                    "text": { "type": "plain_text", "text": "查看 workflow run" },
                    "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                  }
                ]
              }
            ]
          }
          JSON
