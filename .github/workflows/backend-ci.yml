name: Backend CI

on:
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/backend-ci.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend-ci.yml"]

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-insecure-key
      DATABASE_URL: "sqlite://:memory:"
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Format check
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy .

      - name: Migrations are up to date
        run: uv run python manage.py makemigrations --check --dry-run

      # prod 環境變數統一放在 backend/.env.ci（與下方 smoke test 共用）。用 shell source
      # 而非 step env / uv --env-file，是為了讓檔案值蓋過 job-level 的短 SECRET_KEY。
      - name: Deployment checks (check --deploy)
        run: |
          set -a && . ./.env.ci && set +a
          uv run python manage.py check --deploy --fail-level WARNING

      - name: Tests
        run: uv run pytest --cov=apps --cov=config --cov-report=term-missing --cov-fail-under=70

  tests-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18@sha256:4aabea78cf39b90e834caf3af7d602a18565f6fe2508705c8d01aa63245c2e20
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SECRET_KEY: ci-insecure-key
      DATABASE_URL: "postgresql://app:app@localhost:5432/app"
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Tests (Postgres)
        run: uv run pytest

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - name: Export locked requirements
        run: uv export --frozen --no-dev --no-emit-project --format requirements-txt -o requirements-audit.txt

      - name: pip-audit
        run: uvx pip-audit --disable-pip -r requirements-audit.txt

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Build prod image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: backend/docker/Dockerfile
          tags: app:ci
          push: false
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: app:ci
          format: table
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      - name: Smoke test /health/live
        working-directory: .
        run: |
          # 環境變數與 check --deploy 共用 backend/.env.ci；prod 新增必填變數時只改那份檔。
          docker run -d --name smoke -p 8000:8000 --env-file backend/.env.ci app:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health/live; then
              echo "smoke test passed"
              exit 0
            fi
            sleep 2
          done
          echo "smoke test FAILED — container logs:"
          docker logs smoke
          exit 1

      - name: Dump container logs on failure
        if: failure()
        working-directory: .
        run: docker logs smoke || true

      - name: Cleanup
        if: always()
        working-directory: .
        run: docker rm -f smoke || true

  # CI 紅了但沒人知道,等同於沒有 CI。GitHub 預設只寄 email,通常沉在信箱裡。
  # 只在 main 分支失敗時通知 —— PR 的紅燈作者自己看得到,不需要吵整個 channel。
  notify:
    if: failure() && github.ref == 'refs/heads/main'
    needs: [quality, tests-postgres, audit, docker]
    runs-on: ubuntu-latest
    steps:
      - name: Notify Slack
        # 本 job 不做 checkout,workflow 層級的 defaults.run.working-directory
        # 指向的子目錄並不存在 —— 必須覆寫回 repo 根目錄。
        working-directory: .
        env:
          WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "::warning title=CI 失敗通知未啟用::未設定 SLACK_WEBHOOK_URL secret,這次的 CI 失敗沒有通知到 Slack。設定步驟見 backend/docs/alerting.md 第 5 節。"
            exit 0
          fi
          curl -fsS -X POST "$WEBHOOK" \
            -H 'Content-Type: application/json' \
            -d @- <<JSON
          {
            "text": ":rotating_light: Backend CI failed on \`main\` — ${{ github.repository }}",
            "blocks": [
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": ":rotating_light: *Backend CI failed on \`main\`*\n*Repo:* ${{ github.repository }}\n*Commit:* \`${{ github.sha }}\`\n*Author:* ${{ github.actor }}"
                }
              },
              {
                "type": "actions",
                "elements": [
                  {
                    "type": "button",
                    "text": { "type": "plain_text", "text": "查看 workflow run" },
                    "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                  }
                ]
              }
            ]
          }
          JSON
