name: Secrets

# 刻意不加 paths filter:機密可能出現在 repo 的任何角落
# (backend/、frontend/、scripts/、workflow 檔本身)，不該只在特定目錄變動時才掃。
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: secrets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # gitleaks 要掃歷史,不能用 shallow clone

      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:latest \
            detect --source /repo --redact --verbose --exit-code 1
